<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) work on iPhones (bottom nav padding). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>75 Hard Companion</title>
    <meta
      name="description"
      content="Track your 75 Hard challenge — two workouts, diet, water, reading and a progress photo, every day. Works offline; your data stays on your device."
    />

    <meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)" />

    <!-- Applies the saved theme before first paint (no light flash in dark mode). Mirrors
         applyTheme() in src/lib/theme.ts — keep the storage key and colours in sync. -->
    <script>
      ;(function () {
        try {
          var preference = localStorage.getItem('75hard-theme') || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
          if (preference !== 'system') {
            var metas = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < metas.length; i++) metas[i].content = dark ? '#14181a' : '#fbfbf8'
          }
        } catch (e) {}
      })()
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/mascot.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="75 Hard" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>75 Hard Companion needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
