<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) work on iPhones (bottom nav padding). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>75 Hard Companion</title>
    <meta
      name="description"
      content="A friendly offline tracker for 75 Hard, 75 Strong, 75 Medium and 75 Soft: log the day's tasks, watch the streak, keep every progress photo on your device."
    />

    <meta name="theme-color" content="#f9f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16110e" media="(prefers-color-scheme: dark)" />

    <!-- Applies the saved theme and world before first paint (no light flash in dark mode, no
         colour jump). Mirrors applyTheme() and applyWorld() in src/lib — keep the storage keys and
         the world canvases (WORLD_COLORS in src/lib/worldColors.ts, checked by a test) in sync. -->
    <script>
      ;(function () {
        try {
          var canvases = {
            hell: ['#f9f3ea', '#16110e'],
            wasteland: ['#f7f4f0', '#15120f'],
            forest: ['#f1f6f2', '#10140f'],
            meadow: ['#f4f7ee', '#121410'],
            mountains: ['#f1f5f9', '#10141a'],
            heaven: ['#faf6ea', '#171409'],
          }
          var preference = localStorage.getItem('75hard-theme') || 'system'
          var world = localStorage.getItem('75hard-world')
          if (!Object.prototype.hasOwnProperty.call(canvases, world)) world = 'hell'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
          root.setAttribute('data-world', world)
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) {
            var metaDark = preference === 'system' ? (metas[i].media || '').indexOf('dark') >= 0 : dark
            metas[i].content = canvases[world][metaDark ? 1 : 0]
          }
        } catch (e) {}
      })()
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/mascot.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="75 Hard" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>75 Hard Companion needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
