<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading tile prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#10140F;color:#F6ECDC;font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center}
.stage{padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:20px}
.tile{position:relative;width:300px;height:150px;border-radius:20px;background:#221A15;overflow:hidden;box-shadow:0 0 0 1px rgba(246,236,220,.08)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0}
#gl{position:absolute;inset:0;width:300px;height:150px;pointer-events:none;z-index:1}
.front-layer{position:relative;z-index:2}
.icon{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:12px;background:#1C2A20;color:#93C29E}
.check{transition:transform .4s cubic-bezier(.34,1.8,.64,1);transform:scale(0)}
.done .check{transform:scale(1)}
button{font:inherit;font-size:14px;font-weight:600;color:#F6ECDC;background:#221A15;border:1px solid rgba(246,236,220,.15);border-radius:999px;padding:10px 16px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:#A1998D}
.row label{min-width:110px}
</style>
</head>
<body>
<!-- The Reading tile's fill animation, as agreed on 2026-10-09. See README.md beside this file. -->
<div class="stage">
  <div class="tile" id="tile">
    <div class="fill" id="fill"></div>
    <div class="front-layer" style="height:100%;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;align-items:flex-start">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5c3-1 6-.8 8.5 1 2.5-1.8 5.5-2 8.5-1v13c-3-1-6-.8-8.5 1-2.5-1.8-5.5-2-8.5-1z" fill="currentColor" fill-opacity="0.18"></path><path d="M12 6.5v13"></path></svg></span>
      <span style="margin-top:auto;font-size:16px;font-weight:700">Reading</span>
      <span id="status" style="margin-top:2px;font-size:12px;font-weight:600">0 of 10 pages</span>
    </div>
    <span id="chip" style="position:absolute;z-index:2;right:12px;top:12px;height:32px;display:flex;align-items:center;padding:0 10px;border-radius:999px;border:1px solid rgba(246,236,220,.15);font-size:12px;font-weight:700">+ 10 left</span>
    <span class="check" style="position:absolute;z-index:2;right:14px;top:16px;width:26px;height:26px;border-radius:50%;background:#7FB08A;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10140F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    <canvas id="gl" width="300" height="150"></canvas>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button id="one">Turn 1 page</button>
    <button id="four">Read 4 pages</button>
    <button id="all">Finish the 10</button>
    <button id="reset">Reset</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="row"><label for="speed">Page speed</label><input type="range" id="speed" min="1" max="4" step="0.1" value="3" style="width:160px"><span id="speedOut" style="min-width:44px">3.0 s</span></div>
    <div class="row"><label for="fade">Fade starts at</label><input type="range" id="fade" min="30" max="95" step="1" value="70" style="width:160px"><span id="fadeOut" style="min-width:44px">70%</span></div>
    <div class="row"><label for="curve">Gutter curve</label><input type="range" id="curve" min="0" max="100" step="1" value="60" style="width:160px"><span id="curveOut" style="min-width:44px">60%</span></div>
    <div class="row"><label for="base">Page base fade</label><input type="range" id="base" min="0" max="100" step="1" value="60" style="width:160px"><span id="baseOut" style="min-width:44px">60%</span></div>
    <div class="row"><label for="blend">Blend over fill</label><input type="range" id="blend" min="0" max="100" step="1" value="80" style="width:160px"><span id="blendOut" style="min-width:44px">80%</span></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=300,H=150,PW=W/2,NX=60,NY=16,MAX=10,REACH=0.4,FEATHER=18;
let TURN=3000,FADE=0.7,BETA=0.6,BASE=0.6,BLEND=0.8,pages=0,queued=0,busy=false,fillPx=0,serial=0;
const tile=document.getElementById('tile'),fill=document.getElementById('fill'),status=document.getElementById('status'),chip=document.getElementById('chip');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);
const scene=new THREE.Scene();
const D=900,camera=new THREE.PerspectiveCamera(2*Math.atan(H/2/D)*180/Math.PI,W/H,100,2000);camera.position.set(0,0,D);
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth=x=>x*x*(3-2*x);
const clamp=x=>Math.min(1,Math.max(0,x));
const FILL_FROM=0.4,FILL_TO=0.95,START=0.3,GUTTER=0.32;
const restAngle=u=>BETA*(1-smooth(clamp(u/GUTTER)));
const GUTTER_GLSL='float gutterShade(float u,float depth){float g=1.0-smoothstep(0.0,0.34,u);return (g*g*0.42+smoothstep(0.03,0.0,u)*0.25)*depth;}float gutterLight(float u,float depth){return smoothstep(0.1,0.22,u)*(1.0-smoothstep(0.22,0.42,u))*0.07*depth;}';

// The open book at rest: two halves curving down into a shaded gutter.
const halfMat=flip=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,uniforms:{flip:{value:flip},depth:{value:1}},
  vertexShader:'varying float vU;uniform float flip;void main(){vU=flip>0.5?1.0-uv.x:uv.x;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying float vU;uniform float depth;'+GUTTER_GLSL+'void main(){float s=gutterShade(vU,depth),h=gutterLight(vU,depth),a=s+h;gl_FragColor=vec4(vec3(h/max(a,0.0001)),a);}'});
const halves=[0,1].map(flip=>{const g=new THREE.PlaneGeometry(PW,H,NX,1);const m=halfMat(flip);const mesh=new THREE.Mesh(g,m);mesh.renderOrder=0;scene.add(mesh);return {g,m,flip}});
function shapeHalves(){halves.forEach(h=>{const pos=h.g.attributes.position;for(let iy=0;iy<=1;iy++){let x=0,z=0;const y=iy===0?H/2:-H/2;for(let ix=0;ix<=NX;ix++){const u=ix/NX,a=restAngle(u);const i=iy*(NX+1)+(h.flip?NX-ix:ix);pos.setXYZ(i,h.flip?-x:x,y,z);const du=PW/NX;x+=du*Math.cos(a);z+=du*Math.sin(a);}}pos.needsUpdate=true;h.m.uniforms.depth.value=BETA/0.6;})}

// Each page draws its depth first, pushed back a hair, so a curl never blends over itself.
const depthOnly=new THREE.MeshBasicMaterial({transparent:true,colorWrite:false,depthWrite:true,depthTest:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:4});
const pageMat=()=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:true,depthFunc:THREE.LessEqualDepth,side:THREE.DoubleSide,
  uniforms:{cFront:{value:new THREE.Color(0x7fb08a)},cBack:{value:new THREE.Color(0x5f8f6a)},opacity:{value:0},base:{value:BASE},reach:{value:REACH},depth:{value:1},fillX:{value:-W/2},feather:{value:FEATHER},overFill:{value:BLEND},L:{value:new THREE.Vector3(-200,250,600).normalize()}},
  vertexShader:'varying vec3 vN;varying float vU;varying float vX;void main(){vN=normalMatrix*normal;vU=uv.x;vX=(modelMatrix*vec4(position,1.0)).x;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying vec3 vN;varying float vU;varying float vX;uniform vec3 cFront;uniform vec3 cBack;uniform float opacity;uniform float base;uniform float reach;uniform float depth;uniform float fillX;uniform float feather;uniform float overFill;uniform vec3 L;'+GUTTER_GLSL+
  'void main(){vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;float d=max(dot(n,L),0.0);vec3 c=(gl_FrontFacing?cFront:cBack)*(0.62+0.5*d);c=c*(1.0-gutterShade(vU,depth))+vec3(gutterLight(vU,depth));float b=1.0-base*(1.0-smoothstep(0.0,reach,vU));float over=mix(1.0-overFill,1.0,smoothstep(fillX-feather,fillX+feather,vX));gl_FragColor=vec4(c,opacity*b*over);}'});

const active=[];
function makePage(){
  const g=new THREE.PlaneGeometry(PW,H,NX,NY),m=pageMat();
  const k=++serial;
  const depthMesh=new THREE.Mesh(g,depthOnly);depthMesh.renderOrder=2*k;depthMesh.frustumCulled=false;
  const colorMesh=new THREE.Mesh(g,m);colorMesh.renderOrder=2*k+1;colorMesh.frustumCulled=false;
  const p={g,m,depthMesh,colorMesh,start:performance.now(),dur:TURN,fade:FADE,t:0};
  bend(p,0);scene.add(depthMesh,colorMesh);return p;
}
// The page turns around the spine; its bottom-right corner leads and the part by the spine lags, so it curls.
function bend(p,t){
  const pos=p.g.attributes.position;
  for(let iy=0;iy<=NY;iy++){
    const v=1-iy/NY;let x=0,z=0;
    for(let ix=0;ix<=NX;ix++){
      const u=ix/NX;
      const lead=0.3*u*(1-v)+0.12*u;
      const lag=0.16*(1-smooth(clamp(u/0.3)));
      const e=ease(clamp((t-START-lag+lead)/(1-START-lag)));
      const r=restAngle(u),a=r+(Math.PI-2*r)*e;
      pos.setXYZ(iy*(NX+1)+ix,x,v*H-H/2,z+0.5);
      const du=PW/NX;x+=du*Math.cos(a);z+=du*Math.sin(a);
    }
  }
  pos.needsUpdate=true;p.g.computeVertexNormals();
  const fadeIn=clamp(t/0.06),fadeOut=1-smooth(clamp((t-p.fade)/(1-p.fade)));
  const u=p.m.uniforms;u.opacity.value=0.55*Math.min(fadeIn,fadeOut);u.base.value=BASE;u.overFill.value=BLEND;u.depth.value=BETA/0.6;u.fillX.value=fillPx-W/2;
}
// The fill grows with each page in flight, from 40% to 95% of its turn, and has a feathered edge.
const share=p=>smooth(clamp((p.t-FILL_FROM)/(FILL_TO-FILL_FROM)));
function drawFill(){
  const moving=active.reduce((s,p)=>s+share(p),0);fillPx=Math.min(MAX,pages+moving)/MAX*W;
  fill.style.width=(fillPx+FEATHER)+'px';
  const solid=fillPx>=W?100:(fillPx/(fillPx+FEATHER)*100);
  fill.style.background=fillPx<=0?'none':'linear-gradient(90deg,rgba(127,176,138,.30) '+solid+'%,rgba(127,176,138,0) 100%)';
}
function drop(p){scene.remove(p.depthMesh,p.colorMesh);p.g.dispose();p.m.dispose()}
let raf=0;
function loop(now){
  for(let k=active.length-1;k>=0;k--){
    const p=active[k];p.t=clamp((now-p.start)/p.dur);
    if(p.t>=1){pages=Math.min(MAX,pages+1);drop(p);active.splice(k,1);paint();}
  }
  drawFill();active.forEach(p=>bend(p,p.t));renderer.render(scene,camera);
  raf=active.length?requestAnimationFrame(loop):0;
}
function paint(){status.textContent=pages+' of '+MAX+' pages';const left=MAX-pages;chip.style.display=left?'flex':'none';chip.textContent='+ '+left+' left';tile.classList.toggle('done',pages>=MAX);drawFill()}
const pending=()=>pages+active.length;
function next(){
  if(!queued||pending()>=MAX){busy=false;queued=0;return}
  busy=true;queued--;
  if(reduce){pages++;paint();setTimeout(next,80);return}
  active.push(makePage());if(!raf)raf=requestAnimationFrame(loop);
  setTimeout(next,TURN*0.45);
}
function read(n){queued+=n;if(!busy)next()}
document.getElementById('one').onclick=()=>read(1);
document.getElementById('four').onclick=()=>read(4);
document.getElementById('all').onclick=()=>read(MAX-pending());
document.getElementById('reset').onclick=()=>{queued=0;active.forEach(drop);active.length=0;pages=0;paint();renderer.render(scene,camera)};
const bind=(id,out,fn)=>{const s=document.getElementById(id),o=document.getElementById(out);s.oninput=()=>{o.textContent=fn(Number(s.value))}};
bind('speed','speedOut',v=>{TURN=Math.round(v*1000);return v.toFixed(1)+' s'});
bind('fade','fadeOut',v=>{FADE=v/100;return v+'%'});
bind('curve','curveOut',v=>{BETA=v/100;shapeHalves();if(!raf)renderer.render(scene,camera);return v+'%'});
bind('base','baseOut',v=>{BASE=v/100;return v+'%'});
bind('blend','blendOut',v=>{BLEND=v/100;return v+'%'});
shapeHalves();paint();renderer.render(scene,camera);
</script>
</body>
</html>
