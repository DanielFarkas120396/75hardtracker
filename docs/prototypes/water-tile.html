<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water tile prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#10140F;color:#F6ECDC;font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center}
.stage{padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.tile{position:relative;width:358px;height:130px;border-radius:20px;background:#221A15;overflow:hidden;box-shadow:0 0 0 1px rgba(246,236,220,.08)}
#gl{position:absolute;inset:0;width:358px;height:130px;pointer-events:none;z-index:1}
.front-layer{position:relative;z-index:2;text-shadow:0 1px 3px rgba(16,20,15,.7)}
.icon{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:12px;background:#1C2A20;color:#93C29E}
.chip{position:absolute;z-index:3;right:4px;top:4px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#F6ECDC;font:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
.chip span{display:flex;height:32px;align-items:center;gap:4px;padding:0 10px;border-radius:999px;border:1px solid rgba(246,236,220,.15);background:#221A15}
.btn{font:inherit;font-size:14px;font-weight:600;color:#F6ECDC;background:#221A15;border:1px solid rgba(246,236,220,.15);border-radius:999px;padding:10px 16px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:#A1998D}
.row label{min-width:120px}
.row input[type=range]{width:160px}
.row output{min-width:64px}
</style>
</head>
<body>
<!-- The Water tile's fill animation: a rising wave. Chosen on 2026-10-09; Water is the odd tile, so it spans the whole row. See README.md beside this file. -->
<div class="stage">
  <div class="tile" id="tile">
    <canvas id="gl" width="358" height="130"></canvas>
    <div class="front-layer" style="height:100%;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;align-items:flex-start">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c3.6 4.3 6 7.6 6 10.5a6 6 0 0 1-12 0c0-2.9 2.4-6.2 6-10.5z" fill="currentColor" fill-opacity="0.18"></path></svg></span>
      <span style="margin-top:auto;font-size:16px;font-weight:700">Water</span>
      <span id="status" style="margin-top:2px;font-size:12px;font-weight:600">0 / 3.8 L</span>
    </div>
    <button class="chip" id="add" aria-label="Add 250 ml"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>250 ml</span></button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="more">+500 ml</button>
    <button class="btn" id="less">−250 ml</button>
    <button class="btn" id="fill">Fill up</button>
    <button class="btn" id="reset">Reset</button>
  </div>
  <div style="display:flex;gap:16px;font-size:13px;color:#A1998D">
    <label><input type="checkbox" id="medium"> 3 L goal (Medium, Soft)</label>
    <label><input type="checkbox" id="rm"> Reduce motion</label>
  </div>
  <div id="params" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=358,H=130,$=id=>document.getElementById(id);
const clamp=x=>Math.min(1,Math.max(0,x));
const cubicOut=x=>1-Math.pow(1-clamp(x),3);

const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);
const scene=new THREE.Scene();
// One world unit is one CSS pixel on the z=0 plane, as in the reading tile.
const D=900,camera=new THREE.PerspectiveCamera(2*Math.atan(H/2/D)*180/Math.PI,W/H,100,2000);camera.position.set(0,0,D);
const QUAD_VERT='varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
// Where the +250 ml chip sits, from the tile's centre: each pour's ripple starts under it.
const CHIP=(()=>{const t=$('tile').getBoundingClientRect(),c=$('add').firstElementChild.getBoundingClientRect();return c.left+c.width/2-t.left-W/2})();
// The surface's height for a share of the goal: just under the tile when empty, past its top (waves and all) when full.
const surfAt=(L,amp)=>-H/2-amp-3+L*(H+3*amp+19);
// A damped spring: k sets how fast it moves, z how little it overshoots (1 = not at all).
function spring(k,z){
  let y=0,v=0,to=0;
  return {get y(){return y},set(t,instant){to=t;if(instant){y=t;v=0}},kick(dv){v+=dv},
    step(dt){v+=(k*(to-y)-2*z*Math.sqrt(k)*v)*dt;y+=v*dt;const busy=Math.abs(to-y)>.05||Math.abs(v)>.3;if(!busy){y=to;v=0}return busy}};
}

const P={time:2.4,wave:8.5,slosh:69,bubbles:82,shimmer:28,back:66,opacity:78};
const PARAMS=[
  {id:'time',label:'Rise time',min:.2,max:3,step:.05,unit:' s'},
  {id:'wave',label:'Wave height',min:0,max:15,step:.5,unit:' px'},
  {id:'slosh',label:'Slosh',min:0,max:100,step:1,unit:'%'},
  {id:'bubbles',label:'Bubbles',min:0,max:100,step:1,unit:'%'},
  {id:'shimmer',label:'Shimmer',min:0,max:100,step:1,unit:'%'},
  {id:'back',label:'Back wave',min:0,max:100,step:1,unit:'%'},
  {id:'opacity',label:'Opacity',min:20,max:100,step:1,unit:'%'}];

// Two crossing waves make the surface, plus a tilt that sloshes and a ripple running out from the chip.
// A second, darker wave behind gives depth; bubbles drift up, caustics shimmer near the top and a bright line runs under the surface.
const WAVE_FRAG=`varying vec2 vP;uniform vec2 uSize;uniform float uLevel,uTime,uAmp,uSlosh,uRipA,uRipT,uRipX,uBub,uFizz,uShine,uBack;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
float waves(float x,float t,float amp,float ph){return amp*(0.6*sin(x*0.035+t*1.6+ph)+0.4*sin(x*0.071-t*2.3+ph*1.7));}
vec3 bodyColour(float depth,float h){return mix(vec3(0.55,0.74,0.59),vec3(0.2,0.34,0.25),smoothstep(0.0,h,depth));}
float caustic(vec2 p,float t){vec2 q=p*vec2(0.045,0.06);float c=sin(q.x+sin(q.y+t*0.9)*1.6+t*0.7)*sin(q.y-t*0.6+sin(q.x*0.8-t*0.5)*1.3);return pow(1.0-abs(c),10.0);}
float meniscus(float depth){return exp(-depth*depth/3.0);}
float surf(float x,float ph){
  float d=abs(x-uRipX)-170.0*uRipT;
  return uLevel+waves(x,uTime,uAmp,ph)+uSlosh*x/(uSize.x*0.5)+uRipA*sin(d*0.09)*exp(-d*d/1800.0);
}
void main(){
  float x=vP.x,y=vP.y,s=surf(x,0.0),sb=surf(x,2.1)+2.0+uAmp*0.5,depth=s-y;
  float front=smoothstep(s+0.8,s-0.8,y),back=smoothstep(sb+0.8,sb-0.8,y)*(1.0-front)*uBack;
  float bub=0.0;
  for(int i=0;i<14;i++){
    float fi=float(i),per=2.4+2.0*hash(fi),ph=uTime/per+hash(fi+3.3),cyc=floor(ph),a=fract(ph);
    float bx=(hash(fi*1.7+cyc*3.1)-0.5)*uSize.x*0.92+sin(a*11.0+fi)*3.0;
    float by=-uSize.y*0.5+a*(uLevel+uSize.y*0.5+8.0),r=1.2+2.2*hash(fi+9.1),dd=length(vec2(x-bx,y-by));
    bub+=(smoothstep(1.0,0.0,abs(dd-r))*0.8+smoothstep(r,0.0,dd)*0.15)*step(by+r,surf(bx,0.0));
  }
  float hl=(meniscus(depth)+caustic(vP,uTime)*uShine*exp(-max(depth,0.0)/70.0)+bub*uBub*(0.35+uFizz))*front;
  float a=front*0.78+back*0.35;
  vec3 c=(bodyColour(depth,uSize.y)*front*0.78+vec3(0.42,0.6,0.47)*back*0.35)/max(a,0.001);
  gl_FragColor=vec4(mix(c,vec3(0.88,0.97,0.9),clamp(hl,0.0,1.0)),clamp(a+hl*0.4,0.0,1.0));
}`;
const u={uSize:{value:new THREE.Vector2(W,H)},uRipX:{value:CHIP}};
['uLevel','uTime','uAmp','uSlosh','uRipA','uRipT','uBub','uFizz','uShine','uBack'].forEach(k=>u[k]={value:0});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:QUAD_VERT,fragmentShader:WAVE_FRAG,uniforms:u})));

const slosh=spring(25,.12);
let L=0,y0=surfAt(0,P.wave),y1=y0,t=1,time=0,ripT=9,fizz=0;
const level=()=>y0+(y1-y0)*cubicOut(t);
function write(){
  u.uLevel.value=level();u.uTime.value=time;u.uAmp.value=P.wave;u.uSlosh.value=slosh.y;u.uRipA.value=P.slosh/100*5*Math.exp(-ripT/.9);u.uRipT.value=ripT;
  u.uBub.value=P.bubbles/100;u.uFizz.value=fizz;u.uShine.value=P.shimmer/100;
    // The back wave rides higher than the front one: it fades in over the first 12 px of rise so it never peeks out of an empty tile.
    u.uBack.value=P.back/100*clamp((level()-surfAt(0,P.wave))/12);
}
function setLevel(nL,instant){const up=nL>L;L=nL;y0=level();y1=surfAt(L,P.wave);t=instant?1:0;if(instant){y0=y1;slosh.set(0,true)}else if(up){slosh.kick(-P.slosh/100*60);ripT=0;fizz=1}write()}
function update(dt){t=Math.min(1,t+dt/P.time);time+=dt;ripT+=dt;fizz*=Math.exp(-dt/1.2);const s=slosh.step(dt);write();return t<1||s||ripT<3}

let goal=3800,ml=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0,last=0;
$('rm').checked=reduce;
// The waves keep the loop running while there is water (not with reduce motion).
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  const busy=update(dt);renderer.render(scene,camera);
  raf=busy||(!reduce&&L>0)?requestAnimationFrame(frame):0;
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
const litres=v=>String(Number((v/1000).toFixed(2)));
function paint(){
  $('status').textContent=ml>=goal?'Done':litres(ml)+' / '+litres(goal)+' L';$('add').style.display=ml>=goal?'none':'flex';
  $('gl').style.opacity=P.opacity/100;kick();
}
// Reduce motion: no rise, slosh or ripple, the water just stands at its level.
function pour(d){ml=Math.max(0,Math.min(goal,ml+d));setLevel(ml/goal,reduce);paint()}

const fmt=(d,v)=>(Number.isInteger(d.step)?v:v.toFixed(String(d.step).split('.')[1].length))+(d.unit||'');
PARAMS.forEach(d=>{
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('label');label.textContent=d.label;label.htmlFor='p-'+d.id;
  const input=document.createElement('input');Object.assign(input,{type:'range',min:d.min,max:d.max,step:d.step,value:P[d.id],id:'p-'+d.id});
  const out=document.createElement('output');out.textContent=fmt(d,P[d.id]);
  input.oninput=()=>{P[d.id]=Number(input.value);out.textContent=fmt(d,P[d.id]);if(d.id==='wave')setLevel(L,true);write();paint()};
  row.append(label,input,out);$('params').append(row);
});
let timer=0;
$('add').onclick=()=>pour(250);
$('more').onclick=()=>pour(500);
$('less').onclick=()=>pour(-250);
$('reset').onclick=()=>{clearInterval(timer);ml=0;setLevel(0,true);paint()};
$('fill').onclick=()=>{clearInterval(timer);timer=setInterval(()=>{pour(250);if(ml>=goal)clearInterval(timer)},550)};
$('medium').onchange=e=>{goal=e.target.checked?3000:3800;ml=Math.min(ml,goal);setLevel(ml/goal,true);paint()};
$('rm').onchange=e=>{reduce=e.target.checked};
write();paint();
</script>
</body>
</html>
