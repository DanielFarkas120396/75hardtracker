<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workouts tile prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#10140F;color:#F6ECDC;font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center}
.stage{padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.tile{position:relative;width:300px;height:150px;border-radius:20px;background:#221A15;overflow:hidden;box-shadow:0 0 0 1px rgba(246,236,220,.08)}
#gl{position:absolute;inset:0;width:300px;height:150px;pointer-events:none;z-index:1}
.front-layer{position:relative;z-index:2;text-shadow:0 1px 3px rgba(16,20,15,.7)}
.icon{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:12px;background:#1C2A20;color:#93C29E}
.chip{position:absolute;z-index:3;right:4px;top:4px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#F6ECDC;font:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
.chip span{display:flex;height:32px;align-items:center;gap:4px;padding:0 10px;border-radius:999px;border:1px solid rgba(246,236,220,.15);background:#221A15}
.btn{font:inherit;font-size:14px;font-weight:600;color:#F6ECDC;background:#221A15;border:1px solid rgba(246,236,220,.15);border-radius:999px;padding:10px 16px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:#A1998D}
.row label{min-width:120px}
.row input[type=range]{width:160px}
.row output{min-width:52px}
</style>
</head>
<body>
<!-- The Workouts tile's fill animation: a sprint with speed lines. Chosen on 2026-10-09, see README.md beside this file. -->
<div class="stage">
  <div class="tile">
    <canvas id="gl" width="300" height="150"></canvas>
    <div class="front-layer" style="height:100%;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;align-items:flex-start">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="3.5" height="10" rx="1.2" fill="currentColor" fill-opacity="0.18"></rect><rect x="16.5" y="7" width="3.5" height="10" rx="1.2" fill="currentColor" fill-opacity="0.18"></rect><path d="M7.5 12h9M2 10v4M22 10v4"></path></svg></span>
      <span style="margin-top:auto;font-size:16px;font-weight:700">Workouts</span>
      <span id="status" style="margin-top:2px;font-size:12px;font-weight:600">0 of 2 · 45 min each</span>
    </div>
    <button class="chip" id="add" aria-label="Add a workout"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Workout</span></button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="play">Play both workouts</button>
    <button class="btn" id="remove">Remove one</button>
    <button class="btn" id="reset">Reset</button>
  </div>
  <div style="display:flex;gap:16px;font-size:13px;color:#A1998D">
    <label><input type="checkbox" id="one"> One a day (Medium, Soft)</label>
    <label><input type="checkbox" id="rm"> Reduce motion</label>
  </div>
  <div id="params" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=300,H=150,$=id=>document.getElementById(id);
const clamp=x=>Math.min(1,Math.max(0,x));
const inOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);
const scene=new THREE.Scene();
// One world unit is one CSS pixel on the z=0 plane, as in the reading tile.
const D=900,camera=new THREE.PerspectiveCamera(2*Math.atan(H/2/D)*180/Math.PI,W/H,100,2000);camera.position.set(0,0,D);
const QUAD_VERT='varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';

const P={time:.7,rows:12,len:90,soft:16,flow:30,opacity:85};
const PARAMS=[
  {id:'time',label:'Run time',min:.2,max:2,step:.05,unit:' s'},
  {id:'rows',label:'Lanes',min:4,max:30,step:1},
  {id:'len',label:'Streak length',min:10,max:200,step:1,unit:' px'},
  {id:'soft',label:'Ragged front',min:0,max:60,step:1,unit:' px'},
  {id:'flow',label:'Flow after',min:0,max:100,step:1,unit:'%'},
  {id:'opacity',label:'Opacity',min:20,max:100,step:1,unit:'%'}];

// Sprint: the fill races in from the left with speed lines streaking ahead of it; they pull back into it as it stops.
const SPRINT_FRAG=`varying vec2 vP;uniform float uFront;uniform float uVel;uniform float uRows;uniform float uLen;uniform float uSoft;uniform float uTime;uniform float uFlow;
float h1(float n){return fract(sin(n*127.1)*43758.5453);}
void main(){
  float x=vP.x+150.0,rowH=150.0/uRows,row=floor((vP.y+75.0)/rowH),ry=fract((vP.y+75.0)/rowH);
  float thick=smoothstep(0.3,0.08,abs(ry-0.5)),thin=smoothstep(0.14,0.03,abs(ry-0.5)),rs=0.6+0.8*h1(row),off=h1(row+7.3);
  float lead=uLen*uVel*(0.25+0.95*h1(row+3.1)),f=uFront+(h1(row+1.7)-0.5)*uSoft;
  float behind=smoothstep(f,f-uSoft,x);
  float streak=lead>0.5?thick*smoothstep(f,f+lead,x)*step(x,f+lead)*step(f-2.0,x):0.0;
  float flow=thin*pow(fract(x/120.0-uTime*uFlow*rs+off),6.0)*0.6*behind;
  float fill=behind*0.62;
  float a=clamp(fill+streak+flow,0.0,1.0);
  vec3 c=(vec3(0.5,0.69,0.54)*fill+vec3(0.86,0.96,0.88)*(streak+flow))/max(fill+streak+flow,0.001);
  gl_FragColor=vec4(c,a);
}`;
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:QUAD_VERT,fragmentShader:SPRINT_FRAG,
  uniforms:{uFront:{value:-30},uVel:{value:0},uRows:{value:10},uLen:{value:80},uSoft:{value:14},uTime:{value:0},uFlow:{value:0}}});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(W,H),mat));
const frontAt=L=>L<=0?-P.soft-10:L>=1?W+P.soft+10:L*W;
let f0=frontAt(0),f1=f0,t=1,time=0,prev=f0,vel=0;
const front=()=>f0+(f1-f0)*inOut(t);
function write(){const u=mat.uniforms;u.uFront.value=front();u.uVel.value=vel;u.uRows.value=P.rows;u.uLen.value=P.len;u.uSoft.value=P.soft;u.uTime.value=time;u.uFlow.value=P.flow/100}
function setLevel(L,instant){f0=front();f1=frontAt(L);t=instant?1:0;if(instant){f0=f1;vel=0}prev=front();write()}
function update(dt){
  t=Math.min(1,t+dt/P.time);time+=dt;const f=front();
  // How fast the front moves, relative to its top speed, sets how far the streaks reach.
  const v=dt>0?Math.abs(f-prev)/dt/(Math.abs(f1-f0)/P.time*1.5+1e-3):0;prev=f;vel+=(clamp(v)-vel)*Math.min(1,dt*12);
  write();return t<1||vel>.01;
}

let required=2,done=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0,last=0;
$('rm').checked=reduce;
// The flow keeps the loop running while there is fill (not with reduce motion).
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  const busy=update(dt);renderer.render(scene,camera);
  raf=busy||(!reduce&&P.flow>0&&f1>0)?requestAnimationFrame(frame):0;
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function paint(){
  $('status').textContent=done>=required?'Done':done+' of '+required+' · 45 min each';$('add').style.display=done>=required?'none':'flex';
  $('gl').style.opacity=P.opacity/100;kick();
}
// Reduce motion: no run and no streaks, the fill just steps.
function setDone(n){done=Math.max(0,Math.min(required,n));setLevel(done/required,reduce);paint()}

const fmt=(d,v)=>(Number.isInteger(d.step)?v:v.toFixed(String(d.step).split('.')[1].length))+(d.unit||'');
PARAMS.forEach(d=>{
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('label');label.textContent=d.label;label.htmlFor='p-'+d.id;
  const input=document.createElement('input');Object.assign(input,{type:'range',min:d.min,max:d.max,step:d.step,value:P[d.id],id:'p-'+d.id});
  const out=document.createElement('output');out.textContent=fmt(d,P[d.id]);
  input.oninput=()=>{P[d.id]=Number(input.value);out.textContent=fmt(d,P[d.id]);if(d.id==='soft')setLevel(done/required,true);write();paint()};
  row.append(label,input,out);$('params').append(row);
});
let timers=[];
$('add').onclick=()=>setDone(done+1);
$('remove').onclick=()=>setDone(done-1);
$('reset').onclick=()=>{timers.forEach(clearTimeout);done=0;setLevel(0,true);paint()};
$('play').onclick=()=>{$('reset').onclick();timers=[setTimeout(()=>setDone(1),300)];if(required>1)timers.push(setTimeout(()=>setDone(2),2300))};
$('one').onchange=e=>{required=e.target.checked?1:2;done=Math.min(done,required);setLevel(done/required,true);paint()};
$('rm').onchange=e=>{reduce=e.target.checked};
write();paint();
</script>
</body>
</html>
