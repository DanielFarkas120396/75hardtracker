<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet tile prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#10140F;color:#F6ECDC;font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center}
.stage{padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.tile{position:relative;width:300px;height:150px;border-radius:20px;background:#221A15;overflow:hidden;box-shadow:0 0 0 1px rgba(246,236,220,.08)}
#gl{position:absolute;inset:0;width:300px;height:150px;pointer-events:none;z-index:1}
.front-layer{position:relative;z-index:2;text-shadow:0 1px 3px rgba(16,20,15,.6)}
.icon{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:12px;background:#1C2A20;color:#93C29E}
.switches{position:absolute;z-index:3;top:0;bottom:0;right:20px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.sw{display:flex;align-items:center;gap:4px;height:44px;padding:0 4px;border:0;background:none;color:inherit;cursor:pointer;border-radius:999px;touch-action:manipulation}
.sw .em{font-size:20px;line-height:1;position:relative;display:inline-block}
.sw .em small{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.55em}
.track{position:relative;width:32px;height:20px;border-radius:999px;background:#8A8178;transition:background .2s}
.knob{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true] .track{background:#7FB08A}
.sw[aria-checked=true] .knob{transform:translateX(12px)}
.btn{font:inherit;font-size:14px;font-weight:600;color:#F6ECDC;background:#221A15;border:1px solid rgba(246,236,220,.15);border-radius:999px;padding:10px 16px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:#A1998D}
.row label{min-width:120px}
.row input[type=range]{width:160px}
.row output{min-width:52px}
select{font:inherit;font-size:13px;background:#221A15;color:#F6ECDC;border:1px solid rgba(246,236,220,.15);border-radius:8px;padding:4px 8px;width:160px}
</style>
</head>
<body>
<!-- The Diet tile's fill animation: green ink blooming through water. Chosen on 2026-10-09, see README.md beside this file. -->
<div class="stage">
  <div class="tile">
    <canvas id="gl" width="300" height="150"></canvas>
    <div class="front-layer" style="height:100%;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;align-items:flex-start">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13.5 14-14 .5 9-4.5 14-12.5 14z" fill="currentColor" fill-opacity="0.18"></path><path d="M5 19c3-4 6-7 9.5-9.5"></path></svg></span>
      <span style="margin-top:auto;font-size:16px;font-weight:700">Diet</span>
      <span id="status" style="margin-top:2px;font-size:12px;font-weight:600">2 to tick</span>
    </div>
    <div class="switches">
      <button class="sw" id="diet" role="switch" aria-checked="false" aria-label="Diet followed"><span class="em" aria-hidden="true">🍽️</span><span class="track"><span class="knob"></span></span></button>
      <button class="sw" id="alcohol" role="switch" aria-checked="false" aria-label="No alcohol"><span class="em" aria-hidden="true">🍷<small>🚫</small></span><span class="track"><span class="knob"></span></span></button>
      <span id="toast" role="img" aria-label="Social occasion today, a drink is allowed" style="display:none;height:44px;align-items:center;padding:0 8px;font-size:20px">🥂</span>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="play">Play both ticks</button>
    <button class="btn" id="reset">Reset</button>
  </div>
  <div style="display:flex;gap:16px;font-size:13px;color:#A1998D">
    <label><input type="checkbox" id="social"> Social day (1 switch)</label>
    <label><input type="checkbox" id="rm"> Reduce motion</label>
  </div>
  <div id="params" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=300,H=150,$=id=>document.getElementById(id),clamp=x=>Math.min(1,Math.max(0,x));
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,-1,1);

// The ink is one shader on a quad: the edge is a circle around the start point, pushed in and out by layered noise (domain warping),
// darker in its veins and where it pools at the rim.
const INK_FRAG=`varying vec2 vP;uniform float uTime;uniform float uR;uniform float uSwirl;uniform float uSoft;uniform float uScale;uniform vec2 uO;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}
float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}return v;}
void main(){
  vec2 q=vP/uScale;
  vec2 w=vec2(fbm(q+vec2(0.0,uTime*0.08)),fbm(q+vec2(5.2,1.3)-uTime*0.06));
  vec2 w2=vec2(fbm(q+3.0*w+vec2(1.7,9.2)+uTime*0.05),fbm(q+3.0*w+vec2(8.3,2.8)));
  float e=uR-(length(vP-uO)+(w2.x-0.5)*uSwirl*120.0);
  float a=smoothstep(-uSoft,uSoft,e);
  if(a<=0.0)discard;
  float rim=exp(-pow(e/(uSoft*3.0+4.0),2.0)),vein=fbm(q*2.0+w2*2.0);
  vec3 c=mix(vec3(0.58,0.79,0.62),vec3(0.24,0.44,0.30),clamp(vein*1.1+rim*0.6,0.0,1.0));
  gl_FragColor=vec4(c,a*(0.78+0.22*rim));
}`;
const ORIGINS={icon:[-W/2+32,H/2-32],switches:[W/2-40,0],bottom:[0,-H/2-10],corner:[-W/2,-H/2]};
const P={origin:'switches',time:1.1,swirl:81,grain:150,soft:20,drift:36,opacity:67};
const PARAMS=[
  {id:'origin',label:'Starts from',options:[['icon','The leaf icon'],['switches','The switches'],['bottom','The bottom'],['corner','Bottom-left corner']]},
  {id:'time',label:'Spread time',min:.3,max:4,step:.1,unit:' s'},
  {id:'swirl',label:'Swirl',min:0,max:150,step:1,unit:'%'},
  {id:'grain',label:'Swirl size',min:15,max:400,step:1,unit:' px'},
  {id:'soft',label:'Edge softness',min:1,max:50,step:.5,unit:' px'},
  {id:'drift',label:'Drift',min:0,max:100,step:1,unit:'%'},
  {id:'opacity',label:'Opacity',min:20,max:100,step:1,unit:'%'}];

const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,fragmentShader:INK_FRAG,
  vertexShader:'varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  uniforms:{uTime:{value:Math.random()*50},uR:{value:-100},uSwirl:{value:0},uSoft:{value:0},uScale:{value:1},uO:{value:new THREE.Vector2()}}});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(W,H),mat));

// The radius that covers a share of the tile, read off the sorted distances of a grid of points to the start.
let ds=[];
function measure(){const o=ORIGINS[P.origin];mat.uniforms.uO.value.set(o[0],o[1]);ds=[];
  for(let y=0;y<30;y++)for(let x=0;x<60;x++)ds.push(Math.hypot(-W/2+(x+.5)*W/60-o[0],-H/2+(y+.5)*H/30-o[1]));ds.sort((a,b)=>a-b)}
const margin=()=>P.swirl/100*40+P.soft+6;
const radius=L=>L<=0?-margin():L>=1?ds[ds.length-1]+margin():ds[Math.floor(L*ds.length)];
const outQuart=x=>1-Math.pow(1-clamp(x),4);
let L0=0,L1=0,p=1;

let social=false,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0,last=0;
const ticked={diet:false,alcohol:false};
const total=()=>social?1:2,done=()=>(ticked.diet?1:0)+(!social&&ticked.alcohol?1:0);
$('rm').checked=reduce;

function setLevel(target,instant){
  if(instant||reduce){L0=L1=target;p=1}else{L0=L0+(L1-L0)*outQuart(p);L1=target;p=0}
  kick();
}
// The ink keeps drifting while there is any; the loop stops when it's gone or drift is off.
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  p+=dt/P.time;if(!reduce)mat.uniforms.uTime.value+=dt*P.drift/100;
  const u=mat.uniforms,from=radius(L0),to=radius(L1);
  u.uR.value=from+(to-from)*outQuart(p);u.uSwirl.value=P.swirl/100;u.uSoft.value=P.soft;u.uScale.value=P.grain;
  renderer.render(scene,camera);
  raf=p<1||(!reduce&&P.drift>0&&L1>0)?requestAnimationFrame(frame):0;
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function paint(){
  const left=total()-done();$('status').textContent=left?left+' to tick':'Done';
  $('diet').setAttribute('aria-checked',ticked.diet);$('alcohol').setAttribute('aria-checked',ticked.alcohol);
  $('alcohol').style.display=social?'none':'flex';$('toast').style.display=social?'flex':'none';
  $('gl').style.opacity=P.opacity/100;
}
function retarget(){setLevel(done()/total(),false);paint()}

const fmt=(d,v)=>d.options?'':(Number.isInteger(d.step)?v:v.toFixed(String(d.step).split('.')[1].length))+(d.unit||'');
PARAMS.forEach(d=>{
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('label');label.textContent=d.label;label.htmlFor='p-'+d.id;
  let input;
  if(d.options){input=document.createElement('select');d.options.forEach(([v,t])=>input.add(new Option(t,v)))}
  else{input=document.createElement('input');Object.assign(input,{type:'range',min:d.min,max:d.max,step:d.step})}
  input.value=P[d.id];input.id='p-'+d.id;
  const out=document.createElement('output');out.textContent=fmt(d,P[d.id]);
  input.oninput=()=>{P[d.id]=d.options?input.value:Number(input.value);out.textContent=fmt(d,P[d.id]);if(d.id==='origin')measure();paint();kick()};
  row.append(label,input,out);$('params').append(row);
});
let timers=[];
$('diet').onclick=()=>{ticked.diet=!ticked.diet;retarget()};
$('alcohol').onclick=()=>{ticked.alcohol=!ticked.alcohol;retarget()};
$('reset').onclick=()=>{timers.forEach(clearTimeout);ticked.diet=ticked.alcohol=false;setLevel(0,true);paint()};
$('play').onclick=()=>{$('reset').onclick();timers=[setTimeout(()=>$('diet').onclick(),300),social?0:setTimeout(()=>$('alcohol').onclick(),2000)]};
$('social').onchange=e=>{social=e.target.checked;retarget()};
$('rm').onchange=e=>{reduce=e.target.checked;retarget()};
measure();paint();kick();
</script>
</body>
</html>
